<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Rifas Public Site</title>
    <link rel="preconnect" href="__API_BASE_URL__" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=__ASSET_VERSION__" />
    <!-- Meta Pixel pausado temporalmente. -->
    <script>
      window.__PUBLIC_SITE_CONFIG__ = {
        apiBaseUrl: "__API_BASE_URL__",
        mode: "raffles"
      };
    </script>
    <script defer src="/app.js?v=__ASSET_VERSION__"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var match = window.location.pathname.match(/^\/(?:negocio|retail)\/([^/]+)/);
        var apiBase = String(window.__PUBLIC_SITE_CONFIG__.apiBaseUrl || '').replace(/\/+$/, '');
        if (!match || !apiBase || apiBase.indexOf('__') === 0) return;
        var script = document.createElement('script');
        script.src = apiBase + '/public-retail/' + encodeURIComponent(decodeURIComponent(match[1])) + '/repairs/widget.js';
        script.async = true;
        document.head.appendChild(script);
      });
    </script>
  </head>
  <body>
    <div id="app">
      <div class="loading-shell">
        <div class="loading-card">
          <div class="loading-badge">Cargando sitio publico</div>
          <h1>Preparando tu pagina de rifas</h1>
          <p>Estamos leyendo la configuracion desde el backend.</p>
        </div>
      </div>
    </div>
  </body>
</html>
