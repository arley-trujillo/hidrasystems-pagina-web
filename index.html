<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071b35" />
    <meta name="description" content="HIDRA SAS presenta HIDRA SUITE: tecnología que se adapta a la operación real de cada empresa." />
    <meta property="og:title" content="HIDRA SAS | HIDRA SUITE" />
    <meta property="og:description" content="Conecta. Automatiza. Evoluciona." />
    <meta property="og:image" content="/hidra-sas-logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>HIDRA SAS | HIDRA SUITE</title>
    <link rel="icon" href="/hidra-sas-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/suite.css" />
    <script src="/config.js"></script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script>
      (function () {
        var path = String(window.location.pathname || "/").replace(/\/+$/, "") || "/";
        var script = document.createElement("script");
        script.defer = true;

        if (path === "/" || path === "/index.html") {
          window.__HIDRA_SUITE_CONFIG__ = {
            apiBaseUrl: String(window.HIDRA_API_BASE_URL || "").trim(),
            slug: "hidra-suite"
          };
          script.src = "/suite.js";
        } else if (path.indexOf("/negocio/") === 0 || path.indexOf("/retail/") === 0) {
          script.src = "/negocio-app.js";
        } else {
          window.__PUBLIC_SITE_CONFIG__ = {
            apiBaseUrl: String(window.HIDRA_API_BASE_URL || "").trim(),
            mode: "raffles"
          };
          var font = document.createElement("link");
          font.rel = "stylesheet";
          font.href = "https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap";
          document.head.appendChild(font);
          var stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = "/raffles.css";
          document.head.appendChild(stylesheet);
          script.src = "/raffles-app.js";
        }

        document.head.appendChild(script);
      })();
    </script>
  </body>
</html>
